<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מזווה חכם — רשימת קניות</title>
  <link rel="stylesheet" href="shared-theme.css" />
</head>
<body>
  <header class="page-hero">
    <div class="wrap">
      <h1>🛒 מזווה חכם</h1>
      <p>רשימת הקניות נבנית לבד לפי מה שחסר בבית</p>
      <nav class="nav">
        <a href="index.html" class="active">רשימת קניות</a>
        <a href="pantry.html">המזווה</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div id="tip" class="tip"></div>

    <div class="kpis" id="kpis"></div>

    <div class="card">
      <h2>📝 רשימת קניות <span class="count" id="listCount"></span></h2>
      <p class="muted" style="margin:-6px 0 14px">מסודרת לפי מסלול הסופר — סמנו ✓ כשקניתם.</p>
      <div id="list"></div>
    </div>

    <div class="card" id="promoCard" style="display:none">
      <h2>🏷️ מבצעים על מה שצריך</h2>
      <div id="promos"></div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    let toastTimer;
    function toast(msg) {
      const t = $('#toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    function statusBadge(it) {
      const s = SP.status(it);
      if (s === 'out') return '<span class="badge out">נגמר</span>';
      if (s === 'low') return '<span class="badge low">עומד להיגמר</span>';
      return '';
    }

    function predictBadge(it) {
      const d = SP.predictedDaysLeft(it);
      if (d == null) return '';
      if (d <= 0) return '<span class="badge predict">צפוי שנגמר</span>';
      if (d <= 7) return `<span class="badge predict">צפוי להיגמר בעוד ~${d} ימים</span>`;
      return '';
    }

    function expiryBadge(it) {
      if (!SP.isExpiringSoon(it)) return '';
      const d = SP.daysToExpiry(it);
      const txt = d <= 0 ? 'פג תוקף' : `תפוגה בעוד ${d} ימים`;
      return `<span class="badge expiry">⏳ ${txt}</span>`;
    }

    function render() {
      const s = SP.summary();

      // KPIs
      $('#kpis').innerHTML = `
        <div class="kpi out"><div class="num">${s.out}</div><div class="lbl">נגמרו</div></div>
        <div class="kpi low"><div class="num">${s.low}</div><div class="lbl">עומדים להיגמר</div></div>
        <div class="kpi exp"><div class="num">${s.expiring}</div><div class="lbl">לקראת תפוגה</div></div>
        <div class="kpi ok"><div class="num">${s.total}</div><div class="lbl">מוצרים במעקב</div></div>`;

      // Tip
      const tip = SP.contextualTip();
      $('#tip').innerHTML = `<span class="emoji">${tip.emoji}</span><span>${tip.text}</span>`;

      // Shopping list grouped by store route
      const groups = SP.shoppingList();
      $('#listCount').textContent = s.neededCount ? `(${s.neededCount})` : '';
      if (!groups.length) {
        $('#list').innerHTML = '<div class="empty">הכול מלא 🎉 אין מה לקנות כרגע.</div>';
      } else {
        $('#list').innerHTML = groups.map((g) => `
          <div class="cat-group">
            <div class="cat-title">${g.category}</div>
            ${g.items.map((it) => `
              <div class="item-row">
                <button class="check" title="קניתי" data-buy="${it.id}"></button>
                <div class="item-main">
                  <div class="item-name">${escapeHtml(it.name)}
                    ${statusBadge(it)} ${it.isStaple ? '<span class="badge staple">קבוע</span>' : ''}
                    ${it.promo ? '<span class="badge promo">במבצע</span>' : ''}
                  </div>
                  <div class="item-meta">
                    <span>יש: ${fmtQty(it)}</span>
                    ${expiryBadge(it)} ${predictBadge(it)}
                  </div>
                </div>
              </div>`).join('')}
          </div>`).join('');
      }

      // Promos on needed items
      const promoItems = SP.getItems().filter((i) => i.promo && SP.isNeeded(i));
      if (promoItems.length) {
        $('#promoCard').style.display = '';
        $('#promos').innerHTML = promoItems.map((it) => `
          <div class="item-row">
            <div class="item-main">
              <div class="item-name">${escapeHtml(it.name)} <span class="badge promo">במבצע</span></div>
              <div class="item-meta">${it.lastPrice != null ? '₪' + it.lastPrice : ''}</div>
            </div>
          </div>`).join('');
      } else {
        $('#promoCard').style.display = 'none';
      }
    }

    function fmtQty(it) {
      return `${it.currentQty} ${it.unit}`;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    document.addEventListener('click', (e) => {
      const buy = e.target.closest('[data-buy]');
      if (buy) {
        const it = SP.getItem(buy.dataset.buy);
        SP.markPurchased(buy.dataset.buy);
        toast(`✓ ${it ? it.name : 'מוצר'} סומן כנקנה`);
      }
    });

    SP.load();
    SP.onChange(render);
    render();
  </script>
  <script type="module" src="firebase-sync.js"></script>
</body>
</html>
