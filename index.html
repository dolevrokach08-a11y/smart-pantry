<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#eef0f3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="מזווה חכם" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>מזווה חכם</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header" id="header">
      <div class="eyebrow" id="eyebrow">מזווה חכם</div>
      <h1 id="title">רשימת קניות</h1>
    </header>

    <main class="content" id="content">
      <section class="view" id="view-list"></section>
      <section class="view" id="view-pantry" hidden></section>
      <section class="view" id="view-menu" hidden></section>
    </main>

    <nav class="tabbar">
      <button class="tab active" data-tab="list"><span class="ico">🛒</span>רשימה</button>
      <button class="tab" data-tab="pantry"><span class="ico">🥫</span>מזווה</button>
      <div class="fab-slot"><button class="fab" id="fab" aria-label="הוסף מוצר">＋</button></div>
      <button class="tab" data-tab="menu"><span class="ico">☰</span>עוד</button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script src="ui.js"></script>
  <script type="module" src="firebase-sync.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
